name: Monthly AI Portfolio Rebalance

# This system is for long-term investing, not day trading, so it
# rebalances monthly rather than daily — frequent rebalancing adds
# trading costs and chases short-term noise instead of long-term trend.
# Training data, momentum features, and the turnover penalty in
# portfolio_lib.py are all designed around this cadence.

on:
  # Runs at 10:00 PM UTC on the 1st of every month. If the 1st falls on a
  # weekend/holiday, yfinance simply returns the most recent trading day's
  # data — there's no need for this to land on an exact trading day for a
  # monthly-rebalance strategy.
  schedule:
    - cron: '0 22 1 * *'

  # Manual trigger: click "Run workflow" in the GitHub UI
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-ai-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute AI Engine
        env:
          # SEC EDGAR's Fair Access policy requires a descriptive
          # User-Agent with a contact email on every request. Set
          # EDGAR_USER_AGENT as a repository variable (Settings ->
          # Secrets and variables -> Actions -> Variables) to your own
          # contact info, e.g. "ai-portfolio-manager you@example.com".
          # Falls back to a generic placeholder if unset — works, but
          # set your own to follow SEC's guidance.
          EDGAR_USER_AGENT: ${{ vars.EDGAR_USER_AGENT }}
        run: python rebalance.py

      - name: Commit updated metadata (not the model binary)
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add model_metadata.json
          git commit -m "Monthly model metadata update" || echo "No metadata changes to commit"
          git push

      - name: Upload trained model as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: graham-value-ai-model
          path: graham_value_ai.zip
          retention-days: 90

      - name: Publish model to the 'latest-model' release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-model
          name: "Latest trained model"
          body: "Automatically updated by the monthly rebalance workflow. See model_metadata.json in the repo for the holdout backtest score that justified this save."
          files: graham_value_ai.zip
