name: Daily AI Portfolio Manager

on:
  # 1. SCHEDULE TRIGGER: Runs every weekday at 10:00 PM UTC
  schedule:
    - cron: '0 22 * * 1-5'
  
  # 2. DYNAMIC TRIGGER: Runs immediately whenever you push new code changes
  push:
    branches:
      - main
      
  # 3. MANUAL TRIGGER: Allows you to click a "Run" button in the GitHub UI
  workflow_dispatch:

jobs:
  run-ai-agent:
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Download your code and the AI model from the repository
      - name: Checkout Repository
        uses: actions/checkout@v3
        
      # Step 2: Install Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      # Step 3: Install the exact libraries defined in your requirements.txt
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      # Step 4: Run the Python engine to train and allocate
      - name: Execute AI Engine
        run: python daily_updater.py
        
      # Step 5: Save the upgraded brain back to the repository
      - name: Commit and Push Updated Model
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add graham_value_ai.zip
          
          # Only commit if the model actually changed
          git commit -m "Automated Daily Model Update" || echo "No changes to commit"
          git push
